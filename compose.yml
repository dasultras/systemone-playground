# Playground als Container. Ollama läuft nativ auf dem Host (GPU/Metal), daher host.docker.internal.
#   docker compose up
services:
  web:
    image: ghcr.io/dasultras/systemone-playground:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # VLLM_BASE_URL: http://host.docker.internal:8000
      # DEFAULT_MODEL: ollama:elephant-1:9b-q4-ctx8k
      # PRESETS_FILE: /app/config/presets.json
      # Pullen aus der UI erlauben, lädt Modelle auf den Host (belegt Plattenplatz).
      # ALLOW_PULL: "1"
    # Eigene Vorlagen: Datei einhängen und PRESETS_FILE setzen (Standard config/presets.default.json).
    # volumes:
    #   - ./examples/presets.example.json:/app/config/presets.json:ro
    # Docker Desktop kennt host.docker.internal, unter Linux braucht es das Mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
