# Playground as a container. Ollama runs natively on the host (GPU/Metal), hence host.docker.internal.
#   docker compose up
services:
  web:
    image: ghcr.io/dasultras/systemone-playground:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # VLLM_BASE_URL: http://host.docker.internal:8000
      # DEFAULT_MODEL: ollama:elephant-1:9b-q4-ctx8k
      # PRESETS_FILE: /app/config/presets.json
      # Allow pulling from the UI; downloads models to the host (uses disk space).
      # ALLOW_PULL: "1"
    # Custom presets: mount a file and set PRESETS_FILE (default config/presets.default.json).
    # volumes:
    #   - ./examples/presets.example.json:/app/config/presets.json:ro
    # Docker Desktop knows host.docker.internal; on Linux the mapping is required.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
